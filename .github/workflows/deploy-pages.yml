name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'projects/2026-07-metro-budget-tax/web/**'
      - 'projects/2026-07-star-mind/game/**'
      - 'projects/2026-07-san-juan-whale-map/web/**'
      - 'projects/2026-07-san-juan-whale-map/scripts/**'
      - 'projects/2026-08-apl-storytime/web/**'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/deploy-metro-budget-tax.yml'
  # Re-bake Bluesky social.json even when no code landed (PSW day threads move hourly)
  schedule:
    - cron: '25 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  # Never cancel an in-flight Pages deploy — deploy-pages cancels the GitHub
  # deployment on abort, which left whale social.json stuck on stale snapshots.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            projects/2026-07-metro-budget-tax/web/package-lock.json
            projects/2026-07-star-mind/game/package-lock.json
            projects/2026-07-san-juan-whale-map/web/package-lock.json

      - name: Install & build Metro Budget Tax
        working-directory: projects/2026-07-metro-budget-tax/web
        run: |
          npm ci
          npm run build

      - name: Install & build STAR MIND
        working-directory: projects/2026-07-star-mind/game
        run: |
          npm ci
          npm run build

      - name: Refresh Bluesky social snapshot
        working-directory: projects/2026-07-san-juan-whale-map
        continue-on-error: true
        run: python3 scripts/pull_social.py

      - name: Install & build San Juan Whale Odds
        working-directory: projects/2026-07-san-juan-whale-map/web
        run: |
          npm ci
          npm run build

      - name: Stage Pages artifact
        run: |
          SITE="${{ github.workspace }}/_site"
          mkdir -p "$SITE/tax" "$SITE/metro-budget-tax" "$SITE/star-mind" "$SITE/whale" "$SITE/storytime"
          cp -a projects/2026-07-metro-budget-tax/web/dist/. "$SITE/tax/"
          cp -a projects/2026-07-star-mind/game/dist/. "$SITE/star-mind/"
          cp -a projects/2026-07-san-juan-whale-map/web/dist/. "$SITE/whale/"
          cp -a projects/2026-08-apl-storytime/web/. "$SITE/storytime/"

          # Keep old metro path working as a redirect
          cat > "$SITE/metro-budget-tax/index.html" <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta http-equiv="refresh" content="0; url=../tax/" />
              <link rel="canonical" href="/tuchel-general/tax/" />
              <title>Redirecting…</title>
            </head>
            <body>
              <p>Moved to <a href="../tax/">/tax/</a>.</p>
            </body>
          </html>
          HTML

          cat > "$SITE/index.html" <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>tuchel-general</title>
              <style>
                :root { color-scheme: dark; }
                body {
                  margin: 0;
                  min-height: 100vh;
                  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                  background: #0b1220;
                  color: #f4ede4;
                  display: grid;
                  place-items: center;
                }
                main { max-width: 36rem; padding: 2rem; }
                h1 { font-size: 1.25rem; letter-spacing: 0.04em; margin: 0 0 1rem; }
                p { color: #9ca3af; line-height: 1.5; }
                a {
                  color: #2ec4b6;
                  text-decoration: none;
                  border-bottom: 1px solid color-mix(in srgb, #2ec4b6 45%, transparent);
                }
                a:hover { color: #e85d04; border-color: #e85d04; }
                ul { padding-left: 1.1rem; line-height: 2; }
              </style>
            </head>
            <body>
              <main>
                <h1>tuchel-general</h1>
                <p>Published project surfaces from the personal monorepo.</p>
                <ul>
                  <li><a href="whale/">San Juan Whale Odds</a> — boat-renter whale map</li>
                  <li><a href="star-mind/">STAR MIND</a> — Metal Slug–style space shooter</li>
                  <li><a href="tax/">Metro Budget &amp; Tax Explorer</a></li>
                  <li><a href="storytime/">APL Storytime Fall 2026</a> — iCal of Austin Public Library storytimes</li>
                </ul>
              </main>
            </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Pages status can sit in queued/in_progress for several minutes;
          # default 10m is fine, but make it explicit and avoid early cancel.
          timeout: 900000
